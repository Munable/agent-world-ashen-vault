[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-ashen-vault"
version = "0.3.0a1"
description = "Bounded SRD 5.2.1 three-class 1-3 campaign and shared-state co-op preview on Agent World."
requires-python = ">=3.11"
dependencies = ["agent-world @ git+https://github.com/Munable/agent-world.git@b65ddabea74b75a387e90ebcadcba0df680588cf"]

[project.scripts]
ashen-vault = "ashen_vault.server:main"

[tool.setuptools.packages.find]
include = ["ashen_vault*"]

[tool.setuptools.package-data]
ashen_vault = ["web/*"]
