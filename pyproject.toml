[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-ashen-vault"
version = "0.2.0a2"
description = "Bounded SRD 5.2.1 solo adventure preview and melee regression world on Agent World."
requires-python = ">=3.11"
dependencies = ["agent-world @ git+https://github.com/Munable/agent-world.git@422fc56fd63d383fb4dd262981810d88e5db0c73"]

[project.scripts]
ashen-vault = "ashen_vault.server:main"

[tool.setuptools.packages.find]
include = ["ashen_vault*"]

[tool.setuptools.package-data]
ashen_vault = ["web/*"]
