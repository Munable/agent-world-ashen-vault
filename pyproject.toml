[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-ashen-vault"
version = "0.3.0a1"
description = "Bounded SRD 5.2.1 solo adventure preview and melee regression world on Agent World."
requires-python = ">=3.11"
dependencies = ["agent-world @ git+https://github.com/Munable/agent-world.git@a8f58bb3ccd666be7e48739f58d9252a58fa742a"]

[project.scripts]
ashen-vault = "ashen_vault.server:main"

[tool.setuptools.packages.find]
include = ["ashen_vault*"]

[tool.setuptools.package-data]
ashen_vault = ["web/*"]
