name: rules-and-transports
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -VV
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -q
      - run: python tools/probe_campaign.py --count 300
      - run: python tools/probe_classes.py --count 25
      - run: python tools/explore_campaign.py
      - if: runner.os == 'Linux'
        run: python -m pip install playwright
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: python tools/check_browser.py
      - if: runner.os == 'Linux'
        run: python tools/check_campaign_browser.py
      - if: runner.os == 'Linux'
        run: node --test tests/campaign_player.test.mjs
      - run: python -m pip wheel --no-deps --wheel-dir dist .
